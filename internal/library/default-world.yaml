name: %s
description: ""
mainPage: Головна
era: "" # shown after years on the timeline, e.g. "AD"
language: uk

# Article types and their infobox fields, in display order. Edited from the
# app's "Article types" page. A field with `type: date` puts the article on
# the timeline; articles of a type with `event: true` count as events there.
types:
  character:
    label: Персонаж
    color: "#8e5bd4"
    fields:
      - { key: born, label: Народження, type: date, end: died }
      - { key: died, label: Смерть, type: date }
      - { key: species, label: Раса }
      - { key: affiliation, label: Приналежність }
      - { key: occupation, label: Рід занять }
  location:
    label: Локація
    color: "#3f9b5c"
    fields:
      - { key: kind, label: Тип }
      - { key: region, label: Регіон }
      - { key: population, label: Населення }
      - { key: ruler, label: Правитель }
      - { key: founded, label: Засновано, type: date }
  faction:
    label: Фракція
    color: "#c9a227"
    fields:
      - { key: founded, label: Засновано, type: date }
      - { key: founder, label: Засновник }
      - { key: leader, label: Лідер }
      - { key: headquarters, label: Осідок }
      - { key: ideology, label: Ідеологія }
  event:
    label: Подія
    color: "#d9534f"
    event: true
    fields:
      - { key: date, label: Дата, type: date }
      - { key: place, label: Місце }
      - { key: participants, label: Учасники }
      - { key: result, label: Наслідки }
  disambiguation:
    label: Неоднозначність
    fields: []
